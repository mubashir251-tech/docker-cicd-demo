name: Docker CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test application
        run: |
          npm start > /tmp/app.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 20); do
            if node -e "require('http').get('http://127.0.0.1:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"; then
              break
            fi
            sleep 1
          done

          node -e "require('http').get('http://127.0.0.1:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
          npm test

      - name: Build Docker image
        run: docker build -t docker-cicd-demo:test .

      - name: Test Docker container
        run: |
          set -e
          docker run -d --name ci-test -p 3001:3000 docker-cicd-demo:test
          trap 'docker rm -f ci-test >/dev/null 2>&1 || true' EXIT

          ready=false
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3001/health; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != true ]; then
            docker logs ci-test
            exit 1
          fi

          curl -fsS http://127.0.0.1:3001/
          curl -fsS http://127.0.0.1:3001/health

      - name: Validate Docker Compose
        run: docker compose config --quiet

  publish:
    needs: test-and-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/docker-cicd-demo:latest
